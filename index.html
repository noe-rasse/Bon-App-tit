<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <nav class="header-top">
            <img id="img-bon-appetit" src="./images-site/Logo élégant Bon Appétit restaurant.png" alt="">
            <div class="header-ref">
                <a class="nav-text" href="#accueil">Accueil</a>
                <a class="nav-text" href="#cartes">Cartes</a>
                <a class="nav-text" href="#avis">Avis</a>
                <a class="reservation nav-text" href="#reservation">Réservation</a>
            </div>
        </nav>
    </header>
    <main>
        <form action="" method="post">
            <label for="text"><img src="/images-site/person.svg" alt="homme"></label>
            <input type="text" name="name" id="name" placeholder="Bouillon" pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]" required>
            <label for=""><img src="/images-site/calendar_month.svg" alt="Calendrier"></label>
            <input type="date" name="date" id="date" value="2026-12-2" min="2026-12-2" max="2027-03-2" required>
            <label for="choix"><img src="images-site/schedule.svg" alt="Horloge"></label>
            <select name="reservation" id="reservation" required>
                <option value="">-- Selectionner --</option>
                <option value="Option1">12H00</option>
                <option value="Option2">12H30</option>
                <option value="Option3">13h00</option>
                <option value="Option4">13h00</option>
                <option value="Option5">13h30</option>
                <option value="Option6">14H00</option>
                <option value="Option7">19H00</option>
                <option value="Option8">19H30</option>
                <option value="Option9">20H00</option>
                <option value="Option10">20H30</option>
                <option value="Option11">21H00</option>
                <option value="Option12">21H30</option>
            </select>
            <label for="choix"><img src="images-site/group.svg" alt="groupe d'homme"></label>
            <select name="personne" id="perso" required>
                <option value="Option1">-- Selectionner --</option>
                <option value="Option2">1</option>
                <option value="Option3">2</option>
                <option value="Option4">3</option>
                <option value="Option5">4</option>
                <option value="Option6">5</option>
                <option value="otpion7">6</option>
            </select>
            <button type="submit">Réserver</button>
        </form>
    </main>
</body>

</html>
