<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
    <header class="hero">
        <img class="img-fond" src="./images-site/Noir gourmand, table élégante et lumière dorée 1.png" alt="">
        <nav class="navbar container">
            <a href="#accueil" class="logo">
                <img src="./images-site/Logo élégant Bon Appétit restaurant.png" alt="Logo Bon Appétit">
            </a>
            <ul class="nav-links">
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#carte">Notre carte</a></li>
                <li><a href="#galerie">Galerie</a></li>
                <li><a href="#avis">Avis</a></li>
            </ul>
        </nav>
        <div class="hero-content container" id="accueil">
            <p class="subtitle gold">---- RESTAURANT GASTRONOMIQUE ----</p>
            <h1>Bon <span class="accent">Appétit</span></h1>
            <p class="hero-description">Une expérience culinaire unique,<br>au cœur de la gastronomie française.</p>
            <a href="#reservation" class="btn-primary">
                <img src="./images-site/calendar_month.svg" alt="" class="icon">
                <span>Réserver une table</span>
            </a>
        </div>
    </header>
    <main>
        <form action="" method="post">
            <label for="text">Entrer votre nom</label>
            <input type="text" name="name" id="name" placeholder="Bouillon" pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]">
            <label for="choix">Choisissez l'heure de reservation</label>
            <select name="reservation" id="reservation">
                <option value="">-- Selectionner--</option>
                <option value="Option1">12H00</option>
                <option value="Option2">12H30</option>
                <option value="Option3">13h00</option>
                <option value="Option4">13h00</option>
                <option value="Option5">13h30</option>
                <option value="Option6">14H00</option>
                <option value="Option7">19H00</option>
                <option value="Option8">19H30</option>
                <option value="Option9">20H00</option>
                <option value="Option10">20H30</option>
                <option value="Option11">21H00</option>
                <option value="Option12">21H30</option>
            </select>
            <label for="choix">Choisissez le nombre de personne à votre table</label>
            <select name="personne" id="perso">
                <option value="Option1">-- selectionner --</option>
                <option value="Option2">1</option>
                <option value="Option3">2</option>
                <option value="Option4">3</option>
                <option value="Option5">4</option>
                <option value="Option6">5</option>
                <option value="otpion7">6</option>
            </select>
            <button type="submit">Réserver</button>
        </form>
    </main>
</body>
</html>
