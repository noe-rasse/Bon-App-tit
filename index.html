<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/styles.css">
    <title>Document</title>
</head>

<body>
    <main>
        <section class="form-section">
            <div class="right-form">
                <img src="images-site/calendar_month.svg" alt="">
                <div class="reservation">
                    <p>--RESERVATION--</p>
                    <h2>Réserver votre table</h2>
                    <p>
                        En quelques cliques, réservez votre table et profitez
                        d’un moment inoubliable chez Michel Bouillon.
                    </p>
                </div>
            </div>
            <form action="" method="post">
                <div class="name">
                    <img src="images-site/person.svg" alt="Homme">
                    <input type="text" name="name" id="name" placeholder="Bouillon" pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]"
                        required>
                </div>
                <div class="date-hour">
                    <div class="name" id="date">
                        <img src="images-site/calendar_month.svg" alt="Calendrier">
                        <input type="date" name="date" id="date" placeholder="date" required>
                    </div>
                    <div class="name" id="hour">
                        <img src="images-site/schedule.svg" alt="Horloge" class="img">
                        <select name="reservation" id="reservation" required>
                            <option value="">-- Selectionner --</option>
                            <option value="Option1">12H00</option>
                            <option value="Option2">12H30</option>
                            <option value="Option3">13h00</option>
                            <option value="Option4">13h00</option>
                            <option value="Option5">13h30</option>
                            <option value="Option6">14H00</option>
                            <option value="Option7">19H00</option>
                            <option value="Option8">19H30</option>
                            <option value="Option9">20H00</option>
                            <option value="Option10">20H30</option>
                            <option value="Option11">21H00</option>
                            <option value="Option12">21H30</option>
                        </select>
                    </div>
                </div>
                <div class="name" id="number">
                    <img src="images-site/group.svg" alt="Groupe d'homme">
                    <select name="personne" id="perso" required>
                        <option value="Option1">-- Selectionner --</option>
                        <option value="Option2">1</option>
                        <option value="Option3">2</option>
                        <option value="Option4">3</option>
                        <option value="Option5">4</option>
                        <option value="Option6">5</option>
                        <option value="otpion7">6</option>
                    </select>
                </div>
                <button type="submit" class="reserver">Confirmez ma réservation -></button>
            </form>
        </section>
    </main>
</body>

</html>
